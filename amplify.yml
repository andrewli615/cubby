version: 1
applications:
  - appRoot: frontend
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm install 22.23.3 && nvm use 22.23.3
            - npm install --global pnpm@10.33.4
            - cd frontend && pnpm install --frozen-lockfile
        build:
          commands:
            - cd frontend && pnpm lint && pnpm test && pnpm build
      artifacts:
        baseDirectory: frontend/dist
        files:
          - '**/*'
      cache:
        paths:
          - frontend/node_modules/**/*
