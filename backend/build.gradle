plugins {
    id 'java'
}

group = 'com.cubby'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.amazonaws:aws-lambda-java-core:1.2.3'
    implementation platform('software.amazon.awssdk:bom:2.31.54')
    implementation 'software.amazon.awssdk:dynamodb'
    implementation 'software.amazon.awssdk:s3'
    implementation platform('com.fasterxml.jackson:jackson-bom:2.19.2')
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.18.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// Package application and dependencies in the Java Lambda lib/ layout; no upload or deployment.
tasks.register('lambdaZip', Zip) {
    archiveFileName = 'cubby-lambda.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    into('lib') {
        from tasks.named('jar')
        from configurations.runtimeClasspath
    }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('assemble') {
    dependsOn tasks.named('lambdaZip')
}
