services:
  postgres:
    image: postgres:16
    container_name: cubby-postgres
    environment:
      POSTGRES_DB: cubby
      POSTGRES_USER: cubby
      POSTGRES_PASSWORD: cubbydev
    ports:
      - "5432:5432"
    volumes:
      - cubby_postgres_data:/var/lib/postgresql/data

volumes:
  cubby_postgres_data: